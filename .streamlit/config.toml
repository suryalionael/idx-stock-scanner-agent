# Dashboard native theme — PINNED to dark.
# The app no longer switches the native theme at runtime (that was process-
# global and racy, which inverted tables/popovers). Instead dashboard/theme.py
# skins Light mode entirely with CSS + styles dataframe cells with a Styler, so
# both modes are deterministic per session. These values are the dark base used
# for first paint and for the canvas dataframe's header strip / scrollbars.
[theme]
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#0F1115"
secondaryBackgroundColor = "#161A20"
textColor = "#ECEEF2"
font = "sans serif"

[client]
toolbarMode = "minimal"

# fileWatcherType = "none" disables Streamlit's filesystem watcher (inotify on
# Linux). Root cause this fixes: Streamlit Cloud's container hit
# "OSError: [Errno 28] inotify watch limit reached" at startup — the default
# "auto" watcher recursively watches every file under the repo root, and this
# repo's working tree includes data/ (large, many small parquet/csv files) plus
# several unrelated side-projects checked out alongside the app, well past the
# container's inotify limit. Hot-reload-on-file-change is a local dev
# convenience only; disabling it has no effect on app logic or runtime
# behavior, and a deployed app's source doesn't change underneath it anyway.
[server]
fileWatcherType = "none"
