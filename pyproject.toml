[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "idx-stock-scanner-agent"
version = "0.1.0"
description = "AI-powered IDX Stock Scanner: rules + ML + LLM"
requires-python = ">=3.11"
dependencies = [
    # Minimal base — hanya yang dibutuhkan oleh modul stock_scanner yang di-import
    # oleh dashboard (scalping, long_term, level_calculator, issuers, data_loader).
    #
    # On Streamlit Community Cloud, requirements.txt (repo root) wins the
    # dependency-file priority contest (verified against Streamlit's docs —
    # see the comment at the top of requirements.txt for the source and exact
    # order) — THIS list is not what installs streamlit/plotly/yfinance/
    # openpyxl for the deployed app. Separately, Cloud also runs `pip install .`
    # because of [build-system] below, to register stock_scanner as an
    # importable package — that install pulls exactly this list. Jangan
    # tambahkan package berat di sini (heavy/dashboard-only deps belong in the
    # `dashboard`/`scanner`/`all` extras below, not the base). Any package
    # listed both here and in requirements.txt MUST keep an identical version
    # specifier in both files — enforced by tests/test_dependency_consistency.py.
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "requests>=2.31",
]

[project.optional-dependencies]
# Install lokal untuk scanner pipeline: pip install -e ".[scanner]"
scanner = [
    "yfinance>=0.2.40",
    "ta>=0.11",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "anthropic>=0.30",
    "openpyxl>=3.1",          # daily Signal List performance .xlsx export
    "httpx>=0.27",            # AI Lab: async 9router client (stock_scanner/ai_lab/client.py)
    "pydantic>=2.6",          # AI Lab: structured LLM I/O validation (stock_scanner/ai_lab/schemas.py)
    "tenacity>=8.2",          # AI Lab: retry/backoff for 9router calls
    "python-dotenv>=1.0",     # AI Lab: load NINEROUTER_* from a local .env (never committed)
]
# Install lokal dengan dashboard: pip install -e ".[dashboard]"
dashboard = [
    "streamlit>=1.35,<2.0",
    "plotly>=5.22",
]
# Install semua untuk dev: pip install -e ".[all]"
all = [
    "yfinance>=0.2.40",
    "ta>=0.11",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "anthropic>=0.30",
    "openpyxl>=3.1",
    "streamlit>=1.35,<2.0",
    "plotly>=5.22",
    "httpx>=0.27",
    "pydantic>=2.6",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.4",
]

[project.scripts]
idx-scan   = "stock_scanner.pipeline.run_daily_scan:main"
idx-alert  = "stock_scanner.alerts.telegram_alert:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stock_scanner*"]

# ── Poetry (Streamlit Community Cloud) ───────────────────────────────────────
# Streamlit Cloud menggunakan Poetry untuk proyek dengan pyproject.toml.
# Poetry membaca [tool.poetry] untuk konfigurasi khusus-nya, termasuk di mana
# direktori Python package berada.
#
# Tanpa `packages`, Poetry mencari idx_stock_scanner_agent/ (normalized dari
# nama project) → tidak ada → error. Dengan `packages`, Poetry tahu bahwa
# Python package yang di-install adalah stock_scanner/.
#
# Minimum required fields untuk Poetry bisa membaca section ini:
# name, version, description, authors.
[tool.poetry]
name        = "idx-stock-scanner-agent"
version     = "0.1.0"
description = "AI-powered IDX Stock Scanner: rules + ML + LLM"
authors     = []
packages    = [{include = "stock_scanner"}]

# ── uv (fallback jika Streamlit Cloud ganti ke uv) ───────────────────────────
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
