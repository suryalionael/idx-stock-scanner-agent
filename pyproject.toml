[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "idx-stock-scanner-agent"
version = "0.1.0"
description = "AI-powered IDX Stock Scanner: rules + ML + LLM"
requires-python = ">=3.11"
dependencies = [
    # Minimal base — hanya yang dibutuhkan oleh modul stock_scanner yang di-import
    # oleh dashboard (scalping, long_term, level_calculator, issuers, data_loader).
    # Streamlit Cloud menjalankan `pip install .` karena ada pyproject.toml —
    # jangan tambahkan package berat di sini.
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "requests>=2.31",
]

[project.optional-dependencies]
# Install lokal untuk scanner pipeline: pip install -e ".[scanner]"
scanner = [
    "yfinance>=0.2.40",
    "ta>=0.11",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "anthropic>=0.30",
]
# Install lokal dengan dashboard: pip install -e ".[dashboard]"
dashboard = [
    "streamlit>=1.35,<2.0",
    "plotly>=5.22",
]
# Install semua untuk dev: pip install -e ".[all]"
all = [
    "yfinance>=0.2.40",
    "ta>=0.11",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "anthropic>=0.30",
    "streamlit>=1.35,<2.0",
    "plotly>=5.22",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.4",
]

[project.scripts]
idx-scan   = "stock_scanner.pipeline.run_daily_scan:main"
idx-alert  = "stock_scanner.alerts.telegram_alert:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stock_scanner*"]

# ── Poetry (Streamlit Community Cloud) ───────────────────────────────────────
# Streamlit Cloud menjalankan Poetry untuk proyek dengan pyproject.toml.
# Poetry mencari direktori bernama idx_stock_scanner_agent/ (normalized dari
# nama project), tapi direktori yang ada adalah stock_scanner/ — tidak cocok.
#
# package-mode = false → Poetry hanya manage dependencies, tidak install
# project ini sebagai Python package. app.py sudah punya sys.path.insert()
# sehingga stock_scanner tetap importable tanpa pip install.
[tool.poetry]
package-mode = false

# ── uv (fallback jika Streamlit Cloud ganti ke uv di masa depan) ─────────────
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
