name: Signal Performance (20:00 WIB)

# Dedicated evening run of the performance reporting layer ONLY (the screener is
# never re-run here). After IDX close it refreshes the OHLC for the tickers that
# are awaiting evaluation and fills their CSV/Excel for that trading date, so the
# report reflects same-day closing data the SAME night instead of waiting for the
# next morning. Pending rows are re-evaluated every run directly from the
# committed signal_results.csv (not the gitignored per-date signal files), so
# eval_date advances every trading day and no review date is skipped.
#
# Timezone: GitHub cron is UTC. WIB = UTC+7 → 20:00 WIB = 13:00 UTC the SAME day.
# Mon–Fri WIB → Mon–Fri UTC (no day shift) → cron "0 13 * * 1-5". 20:00 WIB (4h
# after the 16:00 close) gives the OHLC source ample time to publish today's bar.
on:
  schedule:
    - cron: "0 13 * * 1-5"   # 20:00 WIB, Mon–Fri (13:00 UTC Mon–Fri)
  workflow_dispatch:

# Commit refreshed data/performance/ back to main (history + dashboard).
permissions:
  contents: write

concurrency:
  group: signal-performance
  cancel-in-progress: true

jobs:
  performance:
    name: Evaluate signals + write CSV/Excel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Jakarta

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # yfinance (same-day OHLC refresh) + openpyxl (.xlsx export).
      - name: Install dependencies
        run: pip install -e ".[scanner]"

      # Restore the signals + raw OHLC produced by scan.yml (gitignored, so they
      # live in the Actions cache). Prefix restore-keys → latest available cache,
      # independent of the universe-hash exact key.
      - name: Restore scan data cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: idx-scan-perf-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            idx-scan-data-${{ runner.os }}-

      # Evening mode: fetch same-day OHLC for tickers awaiting evaluation, then
      # evaluate. Fills today's eval session if published; else leaves pending.
      # --telegram: send the freshly-written daily Excel to Telegram (fail-safe;
      # a Telegram error never blocks file generation or the commit below).
      - name: Evaluate signal performance (evening) + Telegram delivery
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m stock_scanner.pipeline.performance --evening --telegram

      # Rebuilds data/performance/successful_signal_list.xlsx FROM SCRATCH off
      # today's data/performance/daily/*.csv (just refreshed above) — always a
      # full overwrite, never an append, so a stale cache restore of data/ can
      # never leave old rows in the committed file.
      - name: Build successful_signal_list.xlsx (>10% signals)
        run: python scripts/build_successful_signal_list.py

      # Standalone daily persistence (NOT the knowledge_base / Learning Agent
      # Phase 1 table): filters today's freshly-evaluated signal_results.csv
      # to forward_return_pct > 10%, ranks by return + quality-adjusted score
      # (best-effort — degrades gracefully to return-only ranking if no
      # ranked CSV / promoted-model score is available that day), and
      # UPSERTs into a local SQLite table. Self-contained — reads only the
      # already-committed signal_results.csv, so it never depends on
      # data/db/signals.db or the self-improving-system sync step below.
      - name: Build top signals (>10%) table + JSON mirror
        run: python scripts/build_top_signals.py

      # Self-improving-system loop (docs/SELF_IMPROVING_ARCHITECTURE.md):
      # sync today's freshly-evaluated outcomes into the SQLite mirror, then
      # run the alert-only daily drift check. Never retrains or promotes —
      # this step only writes a live_monitoring row and logs a recommended
      # action if a drift flag fires; a human acts on it deliberately via
      # train_challenger.yml / promote_challenger.yml.
      - name: Sync DB + daily drift check
        run: |
          python scripts/init_db_and_backfill.py
          python -c "from stock_scanner.db.init_db import get_connection; from stock_scanner.db.registry_io import import_registry; import_registry(get_connection())"
          python scripts/check_drift.py
          python -c "from stock_scanner.db.init_db import get_connection; from stock_scanner.db.registry_io import export_registry; export_registry(get_connection())"
        # Order note: backfill and registry import touch disjoint tables (the
        # former never writes model_registry/promotion_decisions/
        # live_monitoring), so the exact order between them doesn't change
        # correctness — registry import recovers prior model history,
        # backfill syncs today's freshly-evaluated outcomes, drift check
        # reads both, export persists the new live_monitoring row.

      # IndexAlpha health monitoring (docs/INDEXALPHA_AUDIT.md) — quota-safe,
      # zero network calls, runs every day this workflow runs. continue-on-
      # error so a degraded/misconfigured IndexAlpha integration never blocks
      # the actual job here (signal performance publishing) — the verdict is
      # still clearly visible as a warned step in the Actions run, which is
      # the alert. Never passes --live: spending IndexAlpha quota on a
      # schedule is a deliberate decision this workflow does not make on its
      # own — see indexalpha_live_check.yml (workflow_dispatch only).
      - name: IndexAlpha health check (alert-only, no quota spent)
        continue-on-error: true
        run: python scripts/check_indexalpha_health.py

      - name: Publish performance data to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/performance/ data/published/model_registry.json data/published/top_signals.json || true
          if git diff --cached --quiet; then
            echo "No performance changes to publish."
          else
            git commit -m "data: evening signal performance update ($(date +%F)) [skip ci]"
            git push origin HEAD:main
            echo "Published refreshed performance data to main."
          fi
