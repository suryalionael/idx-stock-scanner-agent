name: Morning Alert (IDX Scanner)

# Scheduled daily IDX scan + Telegram alert at 07:00 WIB.
#
# Timezone math: GitHub Actions cron is ALWAYS UTC. WIB = UTC+7, so
#   07:00 WIB = 00:00 UTC the SAME calendar day.
# To fire 07:00 WIB Mon–Fri we schedule 00:00 UTC Mon–Fri:
#   → cron "0 0 * * 1-5"   (UTC days 1–5 = Mon–Fri)
#
# 07:00 WIB gives the data provider (yfinance) extra time to publish the prior
# session's bar versus 06:00, reducing stale-notice mornings. At 07:00 WIB the
# current day's IDX session has NOT happened yet, so the alert reports the LAST
# COMPLETED trading session (e.g. Thursday 07:00 → Wednesday's data). A freshness
# guard in telegram_alert refuses to send a normal alert if that session's data
# is not yet available (see --require-fresh below).
on:
  schedule:
    - cron: "0 0 * * 1-5"   # 07:00 WIB, Mon–Fri (00:00 UTC Mon–Fri)

  # Allow manual trigger from the GitHub Actions UI — useful for testing.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print message, do NOT send to Telegram)"
        type: boolean
        default: false
      skip_scan:
        description: "Skip daily scan (use cached data only)"
        type: boolean
        default: false

# Prevent overlapping runs (e.g. if a run overruns into the next schedule tick).
concurrency:
  group: morning-alert
  cancel-in-progress: true

jobs:
  alert:
    name: Scan + Telegram Alert
    runs-on: ubuntu-latest
    timeout-minutes: 120   # generous: first run downloads full history (cold cache)
    # Run the whole job on WIB wall-clock so date.today() in the scan and the
    # alert's freshness logic agree on the Indonesian calendar day.
    env:
      TZ: Asia/Jakarta

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ─────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Install the SCANNER extra (yfinance, ta, scikit-learn, xgboost, anthropic).
      # run_daily_scan imports these at module load, so the base/dev extras are
      # NOT enough. We deliberately do NOT install the dashboard extra
      # (streamlit, plotly) — it is not needed for the daily job and only adds
      # weight. The Telegram sender itself uses only pandas + stdlib urllib.
      - name: Install dependencies
        run: pip install -e ".[scanner]"

      # ── 2b. Write the private universe file from a secret ────────────────
      # idx_universe.csv is gitignored (private watchlist) so it is NOT in the
      # checkout. Recreate it from the IDX_UNIVERSE_CSV secret before scanning.
      # Passing the secret via env (not inline ${{ }}) avoids quoting/injection
      # issues and lets GitHub mask it in logs.
      - name: Write universe file from secret
        env:
          IDX_UNIVERSE_CSV: ${{ secrets.IDX_UNIVERSE_CSV }}
        run: |
          mkdir -p stock_scanner/configs
          printf '%s\n' "$IDX_UNIVERSE_CSV" > stock_scanner/configs/idx_universe.csv
          rows=$(grep -cve '^[[:space:]]*$' stock_scanner/configs/idx_universe.csv || true)
          echo "Universe rows written: $rows"
          if [ "$rows" -lt 2 ]; then
            echo "::error::IDX_UNIVERSE_CSV secret is empty or unset — scan will have no tickers."
            exit 1
          fi

      # ── 3. Restore scan data cache ───────────────────────────────────────
      # Cache key includes the universe file hash so a universe change
      # invalidates the data cache and triggers a fresh download.
      - name: Restore scan data cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: idx-scan-data-${{ runner.os }}-${{ hashFiles('stock_scanner/configs/idx_universe.csv') }}
          restore-keys: |
            idx-scan-data-${{ runner.os }}-

      # ── 4. Run daily scan ────────────────────────────────────────────────
      # Skipped only when workflow_dispatch sets skip_scan=true. On a normal
      # scheduled run this always executes and produces today's signal files.
      - name: Run daily scan
        if: >-
          !( github.event_name == 'workflow_dispatch' &&
             github.event.inputs.skip_scan == 'true' )
        run: python -m stock_scanner.pipeline.run_daily_scan
        env:
          # Optional: only needed if the explain agent is enabled in scanner_config.yaml
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # ── 5. Save updated scan data cache ─────────────────────────────────
      # Always save so tomorrow's run picks up today's incremental data.
      - name: Save scan data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: idx-scan-data-${{ runner.os }}-${{ hashFiles('stock_scanner/configs/idx_universe.csv') }}

      # ── 6. Send morning alert ────────────────────────────────────────────
      # if: always() → the alert step runs even if the scan failed. The
      # freshness guard (--require-fresh) compares the latest available scan
      # against the expected last-completed trading session:
      #   • fresh  → sends the normal morning alert (exit 0)
      #   • stale  → sends a short "data belum update" notice, exit 2 (job red)
      # This guarantees an OLD session is never delivered as a normal alert,
      # whether the cause is a scan failure, stale cache, or data-provider lag.
      - name: Send morning alert to Telegram
        if: always()
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m stock_scanner.alerts.telegram_alert --dry-run --require-fresh
          else
            python -m stock_scanner.alerts.telegram_alert --require-fresh
          fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # If TELEGRAM_CHAT_ID secret is unset, the code falls back to the
          # default group (-1003764018733). Set the secret to override.
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # ── 7. Upload scan artifacts (optional, for debugging) ───────────────
      - name: Upload latest ranked CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranked-${{ github.run_id }}
          path: data/ranked/ranked_*.csv
          retention-days: 7
          if-no-files-found: warn
