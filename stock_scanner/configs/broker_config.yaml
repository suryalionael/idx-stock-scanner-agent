# Broker Classification — Single Source of Truth
#
# Full audit + evidence for every entry below: docs/BROKER_CLASSIFICATION_AUDIT.md
#
# Every broker-related feature in this repo reads broker name/type from THIS
# file via stock_scanner.pipeline.broker_analytics.load_broker_config() +
# get_broker_name()/get_broker_type() — never maintain a second hardcoded
# broker-code mapping elsewhere. dashboard/data_loader.py's load_broker_config()
# is a thin re-export of the same function for backward compatibility.
#
# ---------------------------------------------------------------------------
# Schema per broker code (under `brokers:`)
# ---------------------------------------------------------------------------
#   name             — canonical company name, best-supported per the audit.
#   name_confidence  — high | medium | low | none (none = no usable evidence)
#   type             — the AUDITED classification, for future retail-filter /
#                       analytics use: retail | institutional | foreign | mixed_unknown
#   type_confidence  — high | medium | low | none
#   legacy_type      — foreign | big_local | local | unknown. PRESERVED
#                       exactly equal to what stock_scanner.pipeline.
#                       broker_intelligence.classify_broker() returned BEFORE
#                       this audit (derived mechanically from the old hardcoded
#                       FOREIGN_BROKER_CODES/BIG_LOCAL_BROKER_CODES sets) —
#                       stock_scanner/pipeline/smart_money_screener.py depends
#                       on these exact values. Do NOT change without reviewing
#                       that impact; `type` is the field to use for anything new.
#   notes            — one-line evidence pointer; full reasoning is in the audit doc.
#
# A code NOT listed under `brokers:` has no recorded evidence at all — see
# "Codes observed in real trading data with zero classification anywhere" in
# the audit doc. Callers must default such codes to type=mixed_unknown and
# legacy_type=local (if a well-formed 2-letter code) or unknown otherwise —
# exactly the fallback broker_intelligence.classify_broker() already used
# pre-audit; see get_broker_type()'s docstring in broker_analytics.py.
#
# ---------------------------------------------------------------------------
# Validation
# ---------------------------------------------------------------------------
# Every entry's name_confidence/type/type_confidence/legacy_type is checked
# against the values documented above by
# stock_scanner.pipeline.broker_analytics.validate_broker_config() —
# tests/test_broker_analytics.py asserts zero errors against this file, so
# an invalid value (typo, wrong case, a legacy_type value used where type
# belongs, etc.) fails CI immediately. See broker_analytics.py's
# _ENUM_FIELDS if the valid value sets themselves ever need to change.
#
# TODO (deliberately deferred — see docs/BROKER_CLASSIFICATION_AUDIT.md's
# architecture review; do not add these without a concrete feature that
# needs them): ownership_country, aliases, last_reviewed,
# conflicts_with/dispute_group, nested classification blocks, splitting
# this file by section, retail_score, any other new per-broker metadata.
#
# Updated: 2026-07-25 (Broker Classification Audit, Phase 1 + schema validation)

