    institution: "#8b5cf6"
    retail: "#f97316"
    local: "#64748b"
    accumulation: "#4ade80"
    distribution: "#ef4444"
    neutral: "#64748b"

# ---------------------------------------------------------------------------
# NOTES
# ---------------------------------------------------------------------------
# - Broker codes are IDX standard (2-letter codes).
# - `type` (retail/institutional/foreign/mixed_unknown) is the audited
#   classification going forward — see docs/BROKER_CLASSIFICATION_AUDIT.md
#   for full evidence per code before trusting or changing any entry.
# - `legacy_type` exists ONLY to keep broker_intelligence.classify_broker()'s
#   pre-audit output unchanged; do not use it for anything new.
# - A code with type_confidence: none / mixed_unknown is a deliberate,
#   evidence-based "we don't know" — not a placeholder to be filled in casually.
# - Codes with no entry at all here have zero recorded evidence; treat them
#   the same as an explicit mixed_unknown/none entry.
