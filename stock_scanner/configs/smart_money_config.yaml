# Smart Money Screener — configuration
#
# Thresholds for the 5 detectors in stock_scanner/pipeline/smart_money_screener.py
# Tune here without touching code. All detectors degrade gracefully on missing data.

# 1) Volume rises before price (early accumulation footprint)
volume_accumulation:
  min_vol_ratio: 1.5          # today volume >= 1.5x the 20-day average
  strong_vol_ratio: 2.5       # >= 2.5x → strong
  max_roc20_pct: 8.0          # price up <= 8% over 20 days (still sideways)
  max_pct_from_52w_high: -7.0 # at least 7% below the 52w high (not breaking out yet)

# 2) Ownership change (foreign flow + shareholder base) → Accumulation/Neutral/Distribution
ownership_change:
  foreign_5d_pos: 0.0         # foreign_net_5d  > 0  → inflow
  foreign_20d_pos: 0.0        # foreign_net_20d > 0  → inflow
  foreign_flow_score_strong: 6.0
  accum_min_points: 2         # >= 2 bullish points → Accumulation
  distrib_max_points: -1      # <= -1 → Distribution

# 3) Single broker absorbing supply from many different sellers
single_broker_absorption:
  min_seller_count: 3         # supply comes from >= 3 distinct net-seller brokers
  moderate_share: 0.25        # top buyer net >= 25% of total positive net → Moderate
  strong_share: 0.40          # >= 40% → Strong

# 4) Not-yet-risen but being accumulated (price depressed under MAs)
hidden_accumulation:
  require_ma_stack: true      # gate: MA200 > MA5 > last close (price below short & long MA)
  min_vol_ratio: 1.2
  early_min_signals: 1        # aligned accumulation signals → Early
  hidden_min_signals: 2       # → Hidden
  strong_min_signals: 3       # → Strong

# 5) Healthy fundamentals → score 0-100 + grade A/B/C
# Operating cash flow is not available from the free yfinance provider; positive
# EBITDA is used as the operating-profitability proxy (see limitations in code).
fundamentals:
  min_roe_pct: 10.0
  max_der: 1.5
  min_revenue_growth_pct: 0.0
  min_profit_growth_pct: 0.0
  require_positive_ebitda: true
  grade_a_min: 80
  grade_b_min: 60

# Final combined candidate label (how many smart-money pillars align)
combined:
  pillars_strong: 4          # >= 4 aligned pillars → Strong Candidate
  pillars_watch: 2           # >= 2 → Watch
  require_fundamental_grade: ["A", "B"]   # candidate must be fundamentally A or B
