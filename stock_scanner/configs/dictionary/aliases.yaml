# Stock Dictionary — search aliases/abbreviations.
#
# Maps an entry id (from stock_dictionary.yaml) to a list of alternate
# names/abbreviations a user might search for. Searching any alias resolves
# to the same entry — this file is the sole source of that mapping; the UI
# never hardcodes synonym lists itself.
