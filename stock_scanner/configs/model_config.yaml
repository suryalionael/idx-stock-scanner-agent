# IDX ML Ranker — konfigurasi model
# Digunakan oleh ml_ranker.train_ranker() dan ml_ranker.score_candidates()

# --- Target definition ---
# Model memprediksi: apakah return > target_return_pct dalam target_horizon_days?
# Asumsi: swing trading harian IDX (hold beberapa hari)
target_return_pct: 3.0       # % return minimum yang dianggap "sukses"
target_horizon_days: 5       # trading days ke depan (≈1 minggu)

# --- Feature list untuk training dan scoring ---
# Hanya kolom yang tersedia dari feature_builder.build_features() (bukan signal_engine).
# Signal-engine score columns (trend_score, momentum_score, breakout_score, volume_score)
# sengaja TIDAK dimasukkan karena tidak tersedia saat training dari raw OHLCV history.
# Mereka tetap dipakai sebagai filter oleh signal_engine sebelum ML scoring.
features:
  - rsi14
  - macd_histogram
  - macd
  - vol_ratio_20d
  - atr_pct
  - roc5
  - roc20
  - pct_from_52w_high
  - bb_width
  - hist_vol_20d
  - ma_full_alignment
  - ma_partial_alignment
  - slope_ma20
  - price_vs_ma200
  - obv_trend
  - squeeze_release

# --- XGBoost hyperparameters ---
# TODO: tuning via optuna atau GridSearchCV setelah dataset historis tersedia
xgboost:
  n_estimators: 200
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
