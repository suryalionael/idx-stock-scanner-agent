# IDX Stock Scanner — konfigurasi utama
# Edit file ini untuk tuning; tidak perlu ubah kode Python.

# --- Paths (relatif terhadap root repo) ---
base_dir: "."
universe_path: "stock_scanner/configs/idx_universe.csv"
data_dir: "data/raw"
features_dir: "data/features"
signals_dir: "data/signals"
ranked_dir: "data/ranked"
news_dir: "data/news"
foreign_dir: "data/foreign"
broker_dir: "data/broker"
shareholder_dir: "data/shareholders"
fundamentals_dir: "data/fundamentals"
risk_dir: "data/risk"           # UMA / special monitoring override CSV
model_path: "models/ranker.pkl"

# --- Data fetch ---
lookback_years: 3
batch_size: 20           # jumlah ticker per batch yfinance download
max_gap_fill_days: 2     # hari kerja — gap ≤ ini di-ffill; lebih besar → log info

# --- Enrichment pipeline ---
enrichment:
  news:
    enabled: true
    days: 3              # berapa hari ke belakang untuk aggregasi berita
  foreign:
    enabled: true        # PlaceholderForeignFetcher (no-op) by default
  shareholder:
    enabled: true        # PlaceholderShareholderFetcher (no-op) by default
  fundamental:
    enabled: true        # yfinance .info; set false untuk skip (lebih cepat)
    delay_between_tickers: 0.3   # detik antar request (rate limiting)

# --- Signal classification ---
# Gunakan enhanced_total_score (news + foreign adjusted) atau total_score biasa
use_enhanced_score: false   # set true untuk pakai enhanced_total_score di classifier

# ---------------------------------------------------------------------------
# LIQUIDITY HARD GATES
# ---------------------------------------------------------------------------
# Diterapkan SEBELUM scoring. Jika dilanggar → AVOID langsung (skip semua scoring).
# Gunakan turnover = close × volume (estimasi nilai IDR per hari).
liquidity:
  min_turnover_idr: 500_000_000    # Rp 500 juta/hari minimum (hard gate)
  min_volume_shares: 0             # jika perlu filter shares juga (0 = disabled)

# ---------------------------------------------------------------------------
# SIGNAL THRESHOLDS (score 0–10 per komponen)
# ---------------------------------------------------------------------------
# CHANGELOG vs versi sebelumnya:
#   watch.total:       3.5 → 5.0   (-30% → butuh sinyal nyata, bukan noise)
#   pre_markup.total:  5.5 → 6.0   (lebih selektif)
#   pre_markup.trend:  5.0 → 5.0   (tetap)
#   breakout.total:    7.5          (tetap)
#   breakout.breakout: 7.0          (tetap)
#   breakout.volume:   6.0          (tetap)
signal_thresholds:
  breakout:
    total: 7.5           # total_score minimum
    breakout: 7.0        # breakout_score minimum
    volume: 6.0          # volume_score minimum
  pre_markup:
    total: 6.0           # was 5.5 — lebih ketat
    trend: 5.0
  watch:
    total: 5.0           # was 3.5 — MAJOR CHANGE: eliminasi noise

# ---------------------------------------------------------------------------
# PER-TIER CAPS (safety valves — aktif setelah hard gates + thresholds)
# ---------------------------------------------------------------------------
# Jumlah maksimum ticker per signal tier di file ranked.
# Untuk mencegah "ratusan WATCH" bahkan setelah threshold dinaikkan.
signal_caps:
  breakout: 15
  pre_markup: 30
  watch: 50

# --- Explain agent (Claude API) ---
explain:
  enabled: false         # set true setelah ANTHROPIC_API_KEY dikonfigurasi
  max_tickers: 10        # maksimal ticker yang di-explain per scan (hemat API cost)

# --- ML ranking ---
# min_rr: minimum Risk:Reward setelah tick rounding untuk trade_setup_status = "active"
# Di bawah ini → "low_rr" (level tetap dihitung, tapi tidak di-rank aktif)
min_rr: 1.5

# ---------------------------------------------------------------------------
# QUALITY FILTERS — hard exclusion + risk-flag penalty layer
# ---------------------------------------------------------------------------
# evaluate_hard_filters() di pipeline/quality_filters.py membaca section ini.
#
# DER dalam rasio (×), BUKAN persen.  Contoh: DER 1.5 = 150% debt/equity.
# Catatan: yfinance mengembalikan debtToEquity dalam %, sudah dikonversi
# di fundamental.py (÷100) sebelum disimpan ke cache.
quality_filters:

  # -- Fundamental hard exclusion (passes_hard_filters = False) --
  der_max: 4.0              # DER > 4.0× → excluded_fundamental
  pbv_max: 3.5              # PBV > 3.5× → excluded_fundamental
  # EBITDA: hard exclude hanya jika EBITDA < 0 SEKALI + DER > 2.0
  # (single quarter EBITDA negatif bukan otomatis exclude — terlalu agresif)
  # ebitda_negative_exclude: false  ← default off; nyalakan jika mau lebih ketat
  ebitda_negative_exclude: false

  # -- Volume exhaustion (early distribution warning) --
  # vol_ratio_20d > threshold DAN market_cap < cap_threshold_idr → risk flag
  vol_spike_exhaustion_ratio: 5.0
  vol_spike_cap_threshold_idr: 1_000_000_000_000   # < Rp 1T = speculative board

  # -- Public float filter --
  float_hard_min_pct: 5.0     # float < 5% → excluded_float_structure
  float_watch_min_pct: 10.0   # float 5–10% → watch_with_risk
  float_warn_max_pct: 70.0    # float > 70% → catatan di risk_flags (terlalu liquid/blue-chip)

  # -- Quality score adjustments (applied to quality_adjusted_score) --
  # Pengurangan dari total_score, bukan dari hard-filter passes/fails
  penalty_ebitda_negative: 0.5      # EBITDA < 0 → -0.5
  penalty_der_elevated: 0.3         # DER 2.0–4.0 → -0.3
  penalty_float_low: 0.3            # float 5–10% → -0.3
  penalty_vol_exhaustion: 0.2       # vol spike exhaustion → -0.2
  penalty_uma: 1.0                  # is_uma → -1.0
  penalty_data_missing: 0.5         # fundamental_status missing → -0.5

# ---------------------------------------------------------------------------
# KNOWLEDGE APPLICATION — bounded ranking adjustment from curated AI Lab
# knowledge (data/published/knowledge_report.json). See
# stock_scanner/pipeline/knowledge_application.py. Read-only, no LLM, no
# SQLite at scan time. Only applies within an existing signal tier — never
# changes signal/final_status. No-op (byte-identical output) if the file
# is missing/empty or nothing applicable matches.
# ---------------------------------------------------------------------------
knowledge_application:
  enabled: true
  bonus_scale: 1.0        # scale of (shrunk_win_rate - 0.5) per matched entry, before lifecycle weighting
  max_total_bonus: 0.5    # hard cap on the summed bonus per candidate (0-10 total_score scale)

# --- Logging ---
log_level: "INFO"
